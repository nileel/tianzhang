<h1>蓄澜 · 水与地表</h1>
<p>Unity 资源样例 · 2026-11-17重做。正式阶地尺度、原水片与低植网格，六帧由现有战斗命令实际结算。<strong>尚未接入正式 Demo 与 V3 HUD。</strong></p>
<div class="actions"><label>画面尺寸 <select id="resolution"><option value="1920">1920 × 1080</option><option value="1366">1366 × 768</option></select></label><a href="README.md">资源说明与验证</a><a href="evidence/redesign-20261117/1920/runtime-proof.txt" id="proof">当前尺寸运行记录</a></div>
<video controls loop playsinline preload="metadata" poster="evidence/redesign-20261117/1920/04-second-rise.png" src="evidence/redesign-20261117/1920/tide.mp4"></video>
<p>原速连续片段：施放前 → 首次涨潮灭火 → 再次涨潮冲蚀低植 → 两次退潮 → 终止。初始橙色燃烧格沿用现有表现作参照，长明风格化火焰另见 D12.3 资源包。首涨受崖边阻挡，首退将水修向潮源推一格；动作与落点来自实际结算。</p>
<div class="grid">
<figure><a href="evidence/redesign-20261117/1920/01-before.png"><img src="evidence/redesign-20261117/1920/01-before.png" alt="施放前浅水潮源、燃烧格与低植"></a><figcaption>① 施放前：潮源浅水，低植所在格燃烧。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/02-first-rise-moving.png"><img src="evidence/redesign-20261117/1920/02-first-rise-moving.png" alt="首次涨潮中的卷浪、水花和短蒸汽"></a><figcaption>② 首涨中：卷浪向外涌出，原火格短暂蒸汽，低植保留。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/03-first-rise.png"><img src="evidence/redesign-20261117/1920/03-first-rise.png" alt="首涨后湿泥与深水潮源"></a><figcaption>③ 首涨后：火变湿，源变深；低植耐久仍为15。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/04-second-rise.png"><img src="evidence/redesign-20261117/1920/04-second-rise.png" alt="次涨后浅水与已消退的低植"></a><figcaption>④ 次涨后：周围湿地变浅水，低植冲蚀消退；已深的潮源不重复变化。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/05-first-ebb.png"><img src="evidence/redesign-20261117/1920/05-first-ebb.png" alt="首退后湿泥与浅水潮源"></a><figcaption>⑤ 首退后：周围变湿，源变浅；角色位于实际推移落点。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/06-second-ebb.png"><img src="evidence/redesign-20261117/1920/06-second-ebb.png" alt="次退后干地与仍湿的潮源"></a><figcaption>⑥ 次退后：周围露干，潮源仍湿；低植不复生。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/07-terminated.png"><img src="evidence/redesign-20261117/1920/07-terminated.png" alt="终止后潮源露干，未受影响的天然水保持"></a><figcaption>结束：当前归属地表清空，不恢复被改写的旧自然浅水。</figcaption></figure>
<figure><a href="evidence/redesign-20261117/1920/04-second-rise-default-zoom.png"><img src="evidence/redesign-20261117/1920/04-second-rise-default-zoom.png" alt="默认缩放下的浅深水状态"></a><figcaption>默认 size=5 镜头：格位、岸线与角色可辨。主片全程 size=5 默认缩放；size=3 仅补图。</figcaption></figure>

<script>
document.querySelector('#resolution').addEventListener('change',event=>{
  const width=event.target.value;
  for(const element of document.querySelectorAll('[src],[href],[poster]')){
    for(const attr of ['src','href','poster']){
      const value=element.getAttribute(attr);
      if(value)element.setAttribute(attr,value.replace(/evidence\/redesign-20261117\/(1920|1366)\//,`evidence/redesign-20261117/${width}/`));
    }
  }
  document.querySelector('video').load();
});
</script>
