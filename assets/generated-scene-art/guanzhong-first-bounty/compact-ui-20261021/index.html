n-list .tile.long .icon{width:28px;height:28px}#action-list .tile.long small{font-size:20px}#end-turn{position:absolute;left:1540px;top:16px;width:168px;height:64px;flex-direction:row;gap:12px}#log{position:absolute;left:1540px;top:92px;width:168px;height:36px;font-size:22px}#notice{position:absolute;left:500px;top:460px;width:850px;text-align:center;color:#efe9d3;text-shadow:0 2px 4px #081e29;background:#102d38c9;padding:24px;border:1px solid #768d8777}#notice h2{font-size:32px;margin-bottom:10px}#notice p{font-size:23px;line-height:1.7}#legend{position:absolute;left:180px;top:854px;color:#d9e4dc;background:#102d38d9;padding:6px 14px;font-size:20px}

<div id="sheet"></div><div id="stage" hidden></div>
<script>
const icon=n=>`<img class="icon" alt="" src="sprites/icon_${n}.png">`;
const player='../../../../src/Assets/Art/UI/Guanzhong/FormalPlayer_Default_Portrait.png';
const faces=[player,'portraits/enemy_shijiahou.png','portraits/enemy_lieshijia.png'];
const face=(i,selected=false)=>`<img class="portrait${selected?' selected':''}" alt="${['玩家','石甲兽','裂石甲兽'][i]}头像" src="${faces[i]}">`;
const actions=[['attack','铁剑普攻','40 AP'],['guanshiji','贯石击','50 AP · 12 MP'],['julingshu','聚灵术','25 AP · 0 MP'],['feixingzhi','飞星指','50 AP · 10 MP'],['move','移动','随路径报价'],['defend','防御','50 AP'],['switch_art','换术','剩余 2 次'],['equipment','装备精炼玄铁长刀','25 AP · 剩余 1 次'],['medicine','活血丹 ×3','30 AP'],['divine','条件神通','按条件显示']];
function tile(a,cls=''){return `<button class="tile ${cls}" type="button" title="${a[1]}">${icon(a[0])}<span class="name">${a[1]}</span><small>${a[2].replace(/ · /g,'<br>').replace(/(\d+) (AP|MP)/g,'$1&nbsp;$2')}</small></button>`}
const meter=(label,value,color)=>`<div class="meter"><div class="line"><span>${label}</span><span>${value}</span></div><div class="bar" style="--fill:${color}"><i></i></div></div>`;
const states=[['普通','','贯石击','50 AP · 12 MP'],['悬停','forced-hover','贯石击','50 AP · 12 MP'],['按下','forced-pressed','贯石击','50 AP · 12 MP'],['选中','selected','贯石击','50 AP · 12 MP'],['禁用','disabled','贯石击','灵力不足'],['冷却','cooldown','聚灵术','CD 3 刻']];
const sheet=document.querySelector('#sheet');
sheet.innerHTML=`<header><div><h1>天章 · 紧凑战斗 UI</h1><p class="subtitle">V4 素材校样 / 2026.10.21 / 原生矢量切片 + 国风手绘头像</p></div><a href="?view=layout">查看双窗布局 →</a></header><h2>动作图标 · 无烘焙文字 / 无虚构快捷键</h2><div class="catalog">${actions.map(a=>tile([a[0],a[1].startsWith('装备')?'换装':a[1],a[0]==='divine'?'条件入口':'独立图标'])).join('')}</div><h2>六种状态 · 尺寸稳定</h2><div class="states">${states.map(([name,cls,label,cost])=>`<div class="sample">${tile([name==='冷却'?'julingshu':'guanshiji',label,cost],cls)}<span>${name}</span></div>`).join('')}</div><h2>同一套头像 · 详情、行动轴共用</h2><div class="portraits">${faces.map((_,i)=>`<div class="portrait-sample">${face(i)}<div><p>${['无名修士 · 复用','石甲兽 · 暖褐','裂石甲兽 · 冷蓝'][i]}</p><div class="mini">${face(i)}${face(i)}</div><p style="font-size:18px">48 px / 64 px</p></div></div>`).join('')}</div><div class="lower"><section><h2>屏幕配色与资源条</h2><div class="skin">${meter('生命','当前 / 上限','#8fbe75')}${meter('灵力','当前 / 上限','#68c5d9')}${meter('AP','当前 / 上限','#e6bf62')}<div class="swatches">${['#efe9d3','#c2d0cb','#d8be80','#68c5d9','#d99982'].map(c=>`<div class="swatch" style="background:${c}"></div>`).join('')}</div></div></section><section><h2>文字与尺寸</h2><div class="skin legend">地点 34 · 标题 28 · 正文/动作 24 · 费用/原因 22<br>外边距 32 · 内边距 20 · 面板间距 16 · 图标 40<br>以上为 1920×1080 设计尺寸，1366×768 等比缩放。<br>名称可占两行；完整名称与拒绝原因放进预览。<br>六态、头像、资源与文字均独立；九格不封顶。</div></section></div><p class="subtitle">本页是素材及容量校样；数值为文案示例，未执行战斗规则。正式接入与真实点击验收属于 V5–V7。</p>`;
const stage=document.querySelector('#stage');
if(new URLSearchParams(location.search).get('view')==='layout'){
 document.body.classList.add('layout');sheet.hidden=true;stage.hidden=false;
 stage.innerHTML=`<section id="resource" class="skin placed">${face(0)}<div class="copy"><h2>无名修士</h2>${meter('生命','571 / 571','#8fbe75')}${meter('灵力','180 / 180','#68c5d9')}${meter('AP','100 / 100','#e6bf62')}</div></section><section id="timeline" class="skin placed"><h3>行动序列</h3>${[0,2,1].map((i,n)=>`<div class="unit ${n===0?'current':''}">${face(i,i===1)}<small>${[0,7,21][n]}</small></div>`).join('')}</section><div id="location" class="placed">关中野外</div><button id="withdraw" class="tile placed">撤离战斗</button><section id="bounty" class="skin placed"><h3>石甲兽悬赏</h3><p>◇ 击败石甲兽　0 / 1</p></section><section id="details" class="skin placed"><div class="heading"><h3>目标详情</h3><img class="close" src="sprites/icon_close.png" alt="关闭"></div><div class="identity">${face(1,true)}<div><h3>石甲兽</h3><span class="badge">敌方</span></div></div>${meter('生命','329 / 329','#8fbe75')}${meter('灵力','54 / 54','#68c5d9')}<div class="divider"></div><div class="facts"><span>伤害</span><span>未探明</span><span>命中</span><span>未探明</span><span>能力</span><span>未探明</span></div></section><section id="preview" class="skin placed"><div class="heading"><h3>聚灵术 · 目标自身</h3></div><p>费用　25 AP / 0 MP<br>当前 AP　100 → 预计 75<br>作用　所选角色单格</p><button class="tile cancel">取消</button></section><section id="actions" class="skin placed"><div id="actor">${face(0)}<small>你的回合</small></div><div id="action-list">${actions.map((a,i)=>tile(a,`${i===2?'selected ':''}${i===7?'long':''}`)).join('')}</div><button id="end-turn" class="tile end">结束行动 ${icon('end_turn')}</button><button id="log" class="tile">战报</button></section><div id="notice"><h2>战场主体留白</h2><p>此处仅检查 UI 布局与背景对比，不绘制棋盘或虚构运行结果。<br>右侧详情与预览可同时打开；底部含第十个条件入口。</p></div><div id="legend">V4 静态容量校样 · 非 Unity 运行截图 · 长名称/双窗/十动作</div>`;
 const rects={resource:[32,24,416,188],timeline:[32,232,104,512],location:[740,24,440,64],withdraw:[1696,24,192,60],bounty:[1536,112,352,112],details:[1536,232,352,376],preview:[1536,632,352,236],actions:[160,892,1728,164]};
 for(const [id,[x,y,w,h]] of Object.entries(rects))Object.assign(document.getElementById(id).style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1920*s)/2+'px';stage.style.top=(innerHeight-1080*s)/2+'px'};fit();window.onresize=fit;
}
</script></html>
