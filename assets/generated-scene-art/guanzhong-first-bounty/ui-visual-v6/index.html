<div class="review-bar"><div><strong>天章</strong><span>战斗 UI 审阅 / 06 · 固定演示数据</span></div><nav aria-label="审阅状态"><button data-state="player" class="active">玩家行动</button><button data-state="inspect">目标详情</button><button data-state="preview">组合预览</button><button data-state="other">他人行动</button><a href="../ui-visual-v4/">城镇 v4 ↗</a><a href="components.html" target="_blank">通用模板 ↗</a><a href="REUSE-SPEC.md">规格 ↗</a><button id="toggle-density">12人样例</button><span id="unit-count" class="review-density">8人</span></nav><button id="reset-demo">重置演示</button></div>
<main id="viewport"><div id="game-frame" class="ui-root"><section class="screen" id="battle-screen">
<div id="battle-canvas"></div><div class="battle-vignette" aria-hidden="true"></div><div id="world-labels"></div>
<header class="town-hud" aria-label="玩家常驻信息">
      <button class="town-player" data-global="角色" aria-label="角色：无名修士">
        <span class="portrait"><img src="../../../generated-character-art/dialogue-transparent/formal-player-default-male-v1.png" alt="无名修士头像"></span>
        <span class="town-vitals"><span class="player-name">无名修士 <small>道号未取</small></span><span class="realm-tag">练气 · 散修</span>
          <span class="town-meter-label"><span>生命</span><b>571 / 571</b></span><span class="meter health"><i style="width:100%"></i></span>
          <span class="town-meter-label"><span>灵力</span><b>126 / 180</b></span><span class="meter spirit"><i style="width:70%"></i></span>
        </span>
      </button>
      <div class="global-navigation"><nav class="global-actions" aria-label="通用功能">
        <button data-global="角色"><svg class="ui-icon"><use href="#icon-person"/></svg><span>角色</span></button>
        <button data-global="背包"><svg class="ui-icon"><use href="#icon-bag"/></svg><span>背包</span></button>
        <button data-global="功法"><svg class="ui-icon"><use href="#icon-ledger"/></svg><span>功法</span></button>
        <button data-global="术法"><svg class="ui-icon"><use href="#icon-spell"/></svg><span>术法</span></button>
        <button data-global="门派"><svg class="ui-icon"><use href="#icon-sect"/></svg><span>门派</span></button>
        <button id="more-toggle" aria-label="更多功能" aria-expanded="false" aria-controls="more-menu"><span class="more-symbol">···</span><span>更多</span></button>
      </nav><div id="more-menu" class="more-menu" hidden><button id="world-return">山河</button><button id="save-demo">存档</button><button id="settings-demo">设置</button></div></div>
    </header>
<header class="battle-location"><span>关陇玄域 · 关中野外</span><h1>黄土旧道</h1></header>
<aside class="initiative" aria-label="行动轴"><div class="axis-heading"><h2>行动 ↑</h2></div><div class="acting-caption">当前</div><div id="current-actor"></div><div class="axis-next" aria-hidden="true">↑</div><ol id="order-list"></ol></aside><div id="axis-peek" role="tooltip" hidden></div>
<aside class="bounty-tracker" data-ui-panel="dark" aria-label="任务追踪"><div><span class="seal small">悬赏</span><h2>石甲兽悬赏</h2></div><p>◇ 击退拦路石甲兽</p></aside>
<div class="field-tools"><button id="grid-toggle" aria-pressed="false">六角边界</button><button id="camera-toggle" aria-pressed="false">侧看高差</button><button id="log-toggle" aria-expanded="false">战报</button></div>
<aside id="unit-detail" class="detail-sheet" data-ui-panel="paper" aria-label="目标详情" hidden></aside>
<div id="battle-notice" class="battle-notice" data-ui-panel="dark" role="status" hidden></div>
<section id="action-preview" class="cast-preview" data-ui-panel="paper" aria-label="行动预览" hidden></section>
<section id="battle-hotbar" class="battle-hotbar" data-ui-panel="dark" aria-label="当前行动者操作栏"></section>
<div id="other-turn" class="other-turn" data-ui-panel="dark" hidden><span class="seal small">行动</span><div><small>当前行动者</small><strong>石甲兽 · 壹</strong><span>可查看战场与角色详情</span></div><button id="return-player">切回玩家审阅 →</button></div>
<aside id="battle-log" class="battle-log" data-ui-panel="dark" hidden aria-label="战报"><button id="close-log" aria-label="关闭战报">×</button><h2>战报</h2><ol id="log-entries"><li>进入黄土旧道，轮到无名修士行动。</li></ol></aside>
</section></div></main><footer class="review-footer"><div><span>交互设计原型 · 地形与角色为既有三维代理 · CT / 范围 / 消耗 / 结果为固定样例</span></div><div><span id="review-note" role="status">选择招式或点击单位开始审阅</span></div></footer>
